<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Task</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background: #869dbe;
            padding: 20px;
            min-height: 100vh;
        }

        /* Topbar */
        .topbar {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding: 10px 20px;
        }

        .logout-btn {
            background: #e74c3c;
            color: white;
            padding: 10px 18px;
            border-radius: 8px;
            border: none;
            font-weight: 600;
            cursor: pointer;
        }

        .logout-btn:hover {
            background: #c0392b;
        }

        .task-form-container {
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 25px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #333;
        }

        input, textarea, button {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 14px;
        }

        /* Searchable employee field */
        input[list] {
            background: #fff;
        }

        .btn-green {
            background: #28a745;
            color: white;
            font-weight: bold;
            border: none;
            cursor: pointer;
        }

        .btn-green:hover {
            background: #218838;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 15px;
            font-weight: 600;
            color: #2c3e50;
            text-decoration: none;
            font-size: 15px;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        /* ---------------- MEDIA QUERIES ---------------- */

        /* For tablets */
        @media (max-width: 768px) {
            .task-form-container {
                padding: 20px;
            }
            input, textarea, button {
                font-size: 14px;
            }
        }

        /* For small mobile phones */
        @media (max-width: 480px) {
            .task-form-container {
                padding: 15px;
            }
            input, textarea, button {
                padding: 10px;
                font-size: 13px;
            }
            h2 {
                font-size: 18px;
            }
        }
    </style>
</head>
<body>

<!-- Topbar (Logout at right side) -->
<div class="topbar">
    <form action="{% url 'logout' %}" method="post">
        {% csrf_token %}
        <button type="submit" class="logout-btn">Logout</button>
    </form>
</div>

<div class="task-form-container">

    <h2>Create New Task</h2>

    <form method="post">
        {% csrf_token %}

        <input type="text" name="title" placeholder="Task Title" required>

        <textarea name="description" placeholder="Task Description" rows="4" required></textarea>

        <!-- Searchable Employee Field -->
        <input list="employee_list" name="assigned_to" placeholder="Type Employee Name" required>
        <datalist id="employee_list">
            {% for employee in employees %}
                <option value="{{ employee.username }}"></option>
            {% endfor %}
        </datalist>

        <!-- Due Date -->
        <label>Due Date</label>
        <input type="date" name="due_date" required>

        <button type="submit" class="btn-green">Create Task</button>
    </form>

    <!-- Back to Dashboard placed at BOTTOM -->
    <a href="{% url 'hr_dashboard' %}" class="back-link">← Back to Dashboard</a>

</div>

</body>
</html>
