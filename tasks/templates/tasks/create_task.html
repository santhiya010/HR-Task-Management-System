<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Task</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background: #869dbe;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            min-height: 100vh;
        }

        .task-form-container {
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 25px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 500px;
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #333;
        }

        input, textarea, select, button {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 14px;
        }

        /* Green buttons */
        .btn-green {
            background: #28a745;
            color: white;
            font-weight: bold;
            border: none;
            cursor: pointer;
        }

        .btn-green:hover {
            background: #218838;
        }

        /* Logout button */
        .btn-logout {
            background: #28a745;
            color: white;
            font-weight: bold;
            border: none;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 15px;
        }

        /* ------------------ MEDIA QUERIES ------------------ */
        @media (max-width: 768px) {
            body {
                padding: 15px;
            }
            .task-form-container {
                padding: 20px;
            }
        }

        @media (max-width: 480px) {
            h2 {
                font-size: 18px;
            }
            input, textarea, select, button {
                font-size: 13px;
                padding: 10px;
            }
            .task-form-container {
                padding: 15px;
            }
        }
    </style>
</head>
<body>

<div class="task-form-container">

    <!-- Logout button -->
    <form action="{% url 'logout' %}" method="post">
        {% csrf_token %}
        <button type="submit" class="btn-logout">Logout</button>
    </form>

    <h2>Create New Task</h2>
    <form method="post">
        {% csrf_token %}
        <input type="text" name="title" placeholder="Task Title" required>
        <textarea name="description" placeholder="Task Description" rows="4" required></textarea>

        <!-- Assign Employee -->
        <select name="assigned_to" required>
            <option value="">Assign Employee</option>
            {% for employee in employees %}
                <option value="{{ employee.id }}">{{ employee.username }}</option>
            {% endfor %}
        </select>

        <!-- During Period -->
        <input type="text" name="period" placeholder="During Period (e.g., 01-12-2025 to 31-12-2025)" required>

        <!-- Create Task Button -->
        <button type="submit" class="btn-green">Create Task</button>
    </form>
</div>

</body>
</html>
